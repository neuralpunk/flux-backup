# Fuzz targets for everything Flux reads that it didn't write itself (cargo-fuzz layout:
# `cargo fuzz run <target>`; or see fuzz/README.md to build without cargo-fuzz).
[package]
name = "flux-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
flux-core = { path = "../crates/flux-core" }
flux-fs = { path = "../crates/flux-fs" }
flux-vault = { path = "../crates/flux-vault" }
flux-mirror = { path = "../crates/flux-mirror" }
flux-compat = { path = "../crates/flux-compat" }
flux-service = { path = "../crates/flux-service" }
serde_json = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

# Not part of the main workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "vault_pack"
path = "fuzz_targets/vault_pack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_index"
path = "fuzz_targets/vault_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_tree"
path = "fuzz_targets/vault_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_json"
path = "fuzz_targets/vault_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mirror_manifest"
path = "fuzz_targets/mirror_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_meta"
path = "fuzz_targets/snapshot_meta.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profile"
path = "fuzz_targets/profile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "helper_protocol"
path = "fuzz_targets/helper_protocol.rs"
test = false
doc = false
bench = false
