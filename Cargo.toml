[workspace]
resolver = "3"
members = [
    "crates/flux-core",
    "crates/flux-fs",
    "crates/flux-mirror",
    "crates/flux-transport",
    "crates/flux-vault",
    "crates/flux-vault-recover",
    "crates/flux-compat",
    "crates/flux-runner",
    "crates/flux-service",
    "crates/flux-helper",
    "crates/flux-mount",
    "crates/flux-cli",
    "app/src-tauri",
]
# The GUI needs WebKitGTK development packages; plain `cargo build/test` skips it.
default-members = [
    "crates/flux-core",
    "crates/flux-fs",
    "crates/flux-mirror",
    "crates/flux-transport",
    "crates/flux-vault",
    "crates/flux-vault-recover",
    "crates/flux-compat",
    "crates/flux-runner",
    "crates/flux-service",
    "crates/flux-helper",
    "crates/flux-mount",
    "crates/flux-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neuralpunk/flux-backup"
authors = ["The Flux Backup contributors"]

[workspace.dependencies]
flux-core = { path = "crates/flux-core" }
flux-fs = { path = "crates/flux-fs" }
flux-mirror = { path = "crates/flux-mirror" }
flux-vault = { path = "crates/flux-vault" }
flux-compat = { path = "crates/flux-compat" }
flux-transport = { path = "crates/flux-transport" }
flux-runner = { path = "crates/flux-runner" }
flux-service = { path = "crates/flux-service" }
flux-mount = { path = "crates/flux-mount" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help", "string"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
humantime = "2"
rustix = { version = "1.1", features = ["fs", "system", "process", "thread", "event"] }
rayon = "1.12"
ignore = "0.4"
zstd = "0.14"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde_bytes = "0.11"
jiff = { version = "0.2", features = ["serde"] }
blake3 = "1.8"
indicatif = "0.18"
ctrlc = "3.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Optimize dependencies (crypto, compression, hashing) even in debug builds; tests that
# push real data through them are many times faster.
[profile.dev.package."*"]
opt-level = 2
