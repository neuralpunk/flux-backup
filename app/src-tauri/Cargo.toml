[package]
name = "flux-gui"
description = "Flux Backup desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "flux_gui"
crate-type = ["rlib"]

[[bin]]
name = "flux-backup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
flux-core.workspace = true
flux-service.workspace = true
flux-runner.workspace = true
serde.workspace = true
jiff.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Single instance over the session bus (already used by flux-runner; no extra crates).
zbus = { version = "6", default-features = false, features = ["default-rt"] }
futures-util = { version = "0.3", default-features = false }

[lints]
workspace = true
