name: Release
# Push a tag like v0.2.0 to build the packages and attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported Ubuntu, so the AppImage and the binaries run on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # flux-vault-recover is built static, to run on any Linux.
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
          patchelf file fuse3 libfuse2 musl-tools
      - name: Tests
        run: cargo test --locked
      - name: Packages (deb, rpm, AppImage)
        working-directory: app
        run: npm ci && npx tauri build
      - name: Command-line tarball
        run: |
          version=$(cargo pkgid -p flux-cli | sed 's/.*[#@]//')
          name=flux-backup-cli-$version-x86_64-linux
          # Same layout as a source tree, so packaging/install.sh works unchanged.
          mkdir -p "$name/packaging" "$name/target"
          cp -r target/dist "$name/target/dist"
          cp -r packaging/polkit packaging/linux packaging/install.sh "$name/packaging/"
          cp README.md LICENSE-MIT LICENSE-APACHE docs/USER_GUIDE.md "$name/"
          tar czf "$name.tar.gz" "$name"
          # The Vault recovery tool on its own: one static file.
          tool=flux-vault-recover-$version-x86_64-linux
          cp target/dist/flux-vault-recover "$tool"
          # Bare file names, so `sha256sum -c SHA256SUMS` works next to the downloads.
          sha256sum "$name.tar.gz" "$tool" > SHA256SUMS
          for f in target/release/bundle/*/*.{deb,rpm,AppImage}; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done >> SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --generate-notes \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage \
            flux-backup-cli-*.tar.gz flux-vault-recover-*-x86_64-linux SHA256SUMS
